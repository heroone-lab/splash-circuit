<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16324a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Splash Circuit — 3D Obstacle Course</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="src/ui/styles.css">
<script src="build-config.js"></script>
</head>
<body>
<canvas id="game" aria-label="Game view"></canvas>
<div id="touchLayer"></div>
<div id="touchStick"><div></div></div>
<div id="ui"></div>
<div id="rotate">Rotate your device to landscape ↻</div>
<!-- Boot screen: pure HTML/CSS so something is visible before any script loads -->
<div id="boot">
  <div class="boot-logo"><span>SPLASH</span><span>CIRCUIT</span></div>
  <div class="boot-bar"><div id="bootBar"></div></div>
  <div id="bootMsg">Loading…</div>
  <noscript>JavaScript is required to play.</noscript>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
